services:
    servidor_dev:
        build:
            context: .
            dockerfile: docker/Dockerfile
        container_name: servidor
        tty: true
        ports:
            - "8080:80"
        volumes:
            - ./app:/var/www
            - ./docker/apache/apache2.conf:/etc/apache2/apache2.conf
            - ./docker/apache/xdebug.ini:/etc/php/8.5/apache2/conf.d/xdebug.ini
            - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf
            - ./docker/apache/logs:/var/www/logs
        environment:
            - ENABLE_XDEBUG=1
            - TZ=America/Sao_Paulo
        extra_hosts:
            - "host.docker.internal:host-gateway"
        networks:
            - my_network

    redis_dev:
        image: "redis:alpine"
        container_name: redis
        ports:
            - "6379:6379"

    mariadb_dev:
        container_name: mariadb
        # build: ./docker/mysql
        image: mariadb:latest
        command: --default-authentication-plugin=mysql_native_password
        environment:
            - MYSQL_ROOT_PASSWORD=root
            - MYSQL_USER=admin
            - MYSQL_PASSWORD=servidor
        volumes:
             - ./mysql_data:/var/lib/mysql:rw
        ports:
            - "3306:3306"
        networks:
            - my_network

    phpmyadmin_dev:
        image: phpmyadmin:5.2.3
        container_name: phpmyadmin
        environment:
            - PMA_HOST=mariadb_dev
            - PMA_PORT=3306
            - MYSQL_ROOT_PASSWORD=root        
        ports:
            - "8081:80"
        networks:
            - my_network
    
    postgres_dev:
        image: postgres:18-alpine
        container_name: postgres
        environment:
            - POSTGRES_USER=admin
            - POSTGRES_PASSWORD=servidor
            - POSTGRES_DB=postgres_db
        ports:
            - "5432:5432"
        networks:
            - my_network
        volumes:
          - ./postgres_data:/var/lib/postgresql:rw

networks:
    my_network: